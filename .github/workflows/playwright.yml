# Runs the recovery project in starter/ on every push, pull request,
# and manual dispatch. When a student pushes this repository to their
# own GitHub account, this workflow runs in *their* repository.
#
# Quality gates (any failure fails the `test` check):
#   1. npm ci      — reproducible install from the committed lockfile
#   2. Typecheck   — tsc --noEmit (Playwright strips types but never checks them)
#   3. Tests       — every Playwright project: api (DummyJSON) + chromium/firefox/webkit (SauceDemo)
# See docs/ci-quality-gates.md for local commands and required-check setup.
name: Playwright Tests
on: [push, pull_request, workflow_dispatch]

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

# A new push to the same PR cancels its outdated run; runs on branches/main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # Workflows must live at the repo root; the project is nested.
        working-directory: starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: starter/package-lock.json
      # Reproducible install from the committed lockfile.
      - name: Install dependencies
        run: npm ci
      # Pinned TypeScript, fetched on demand (not a project dependency). Runs before
      # the browser download so type errors fail fast.
      - name: Typecheck
        run: npx --yes -p typescript@7.0.2 tsc --noEmit
      # Browsers + Linux system dependencies.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      # All projects. Playwright exits non-zero on any failure or when no tests are found.
      - name: Run API + UI tests
        run: npx playwright test
      # Keep the HTML report even when tests fail (but not when cancelled).
      # An upload step never changes the job result.
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: starter/playwright-report/
          retention-days: 30
      # Traces from failed tests (trace: 'on-first-retry' writes them to test-results/).
      - name: Upload failure traces
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-test-results
          path: starter/test-results/
          retention-days: 14
          if-no-files-found: ignore
